<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi calo</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f1e1b;--muted:#6b6a64;--line:#e3e1d9;--accent:#1d9e75;--accent-bg:#e1f5ee;--warn:#ba7517;--warn-bg:#faeeda;--chip:#f1efe8}
@media (prefers-color-scheme:dark){:root{--bg:#181816;--card:#232320;--text:#ecebe6;--muted:#a3a29b;--line:#3a3935;--accent:#5dcaa5;--accent-bg:#0f3a2e;--warn:#ef9f27;--warn-bg:#3a2a10;--chip:#2e2d29}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.date{color:var(--muted);font-size:14px}
.total{font-size:30px;font-weight:600;margin:2px 0}
.total small{font-size:16px;color:var(--muted);font-weight:400}
.bar{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .25s}
.status{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px}
.status.ok{background:var(--accent-bg);color:var(--accent)}
.status.low{background:var(--warn-bg);color:var(--warn)}
.sub{display:flex;gap:16px;margin-top:6px;font-size:14px;color:var(--muted)}
.meal{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:12px}
.meal h2{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.meal h2 span{font-size:14px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.food{position:relative;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 10px;text-align:left;color:var(--text);font:inherit;cursor:pointer;min-height:58px}
.food b{display:block;font-size:15px;font-weight:600}
.food i{font-style:normal;font-size:12px;color:var(--muted)}
.food.on{border-color:var(--accent);background:var(--accent-bg)}
.cnt{position:absolute;top:6px;right:8px;font-weight:700;color:var(--accent)}
.minus{position:absolute;bottom:6px;right:6px;width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:18px;line-height:1;cursor:pointer}
.custom{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.custom input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
.custom input[type=number]{flex:0 0 90px}
.custom button,.reset{padding:8px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;cursor:pointer}
.extra{font-size:14px;margin-top:6px}
.extra div{display:flex;justify-content:space-between;padding:2px 0}
.extra button{border:none;background:none;color:var(--warn);cursor:pointer;font:inherit}
.reset{background:none;color:var(--muted);border-color:var(--line);margin-top:18px;width:100%}
.note{font-size:13px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="date" id="date"></div>
    <div class="total"><span id="kcal">0</span> <small>/ 2.200–2.400 kcal</small></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="sub"><span>Đạm: <b id="pro">0</b> / 75 g</span><span>Bữa đã ăn: <b id="nmeal">0</b> / 6</span></div>
    <div class="status low" id="status"></div>
  </div>
  <div id="meals"></div>
  <button class="reset" id="reset">Xóa hết hôm nay</button>
  <p class="note">Số calo là mức trung bình, mỗi loại có thể lệch một chút. Sữa: xem số chính xác ở mục "Năng lượng" trên vỏ hộp. Sang ngày mới trang tự xóa để ghi lại từ đầu. Dữ liệu chỉ lưu trên máy đang dùng.</p>
</main>
<script>
const TARGET_MIN=2200,TARGET_MAX=2400,PRO_TARGET=75;
const FOODS=[
 {id:'com',name:'Cơm',unit:'1 chén (~150g)',kcal:200,pro:4},
 {id:'trung',name:'Trứng gà',unit:'1 quả',kcal:75,pro:6},
 {id:'chuoi',name:'Chuối',unit:'1 quả vừa',kcal:100,pro:1},
 {id:'suaduong',name:'Sữa có đường',unit:'1 hộp 180ml',kcal:135,pro:5.5},
 {id:'suakhong',name:'Sữa không đường',unit:'1 hộp 180ml',kcal:115,pro:5.5},
 {id:'thitnac',name:'Thịt lợn nạc',unit:'1 lạng (100g)',kcal:145,pro:19},
 {id:'bachi',name:'Thịt ba chỉ',unit:'1 lạng (100g)',kcal:260,pro:16},
 {id:'ga',name:'Thịt gà',unit:'1 lạng (100g)',kcal:170,pro:20},
 {id:'ca',name:'Cá',unit:'1 lạng (100g)',kcal:120,pro:20},
 {id:'dauphu',name:'Đậu phụ',unit:'1 bìa (~100g)',kcal:95,pro:10},
 {id:'rau',name:'Rau',unit:'1 đĩa / bát canh',kcal:30,pro:2},
 {id:'dau',name:'Dầu / mỡ',unit:'1 thìa canh',kcal:120,pro:0},
 {id:'banhmi',name:'Bánh mì',unit:'1 ổ',kcal:250,pro:8},
 {id:'khoai',name:'Khoai lang',unit:'1 củ vừa',kcal:130,pro:2},
 {id:'mitom',name:'Mì tôm',unit:'1 gói',kcal:350,pro:7},
 {id:'lac',name:'Lạc rang',unit:'1 nắm (30g)',kcal:170,pro:7}
];
const MEALS=[
 {id:'sang',name:'Sáng',time:'6h30'},
 {id:'phusang',name:'Phụ sáng',time:'9h30'},
 {id:'trua',name:'Trưa',time:'11h30'},
 {id:'phuchieu',name:'Phụ chiều',time:'16h'},
 {id:'toi',name:'Tối',time:'18h30'},
 {id:'ngu',name:'Trước khi ngủ',time:'21h'}
];
const KEY='theo-doi-calo-v1';
const F=Object.fromEntries(FOODS.map(f=>[f.id,f]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function blank(){return {date:today(),items:{},extra:{}}}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||S.date!==today())S=blank();S.items=S.items||{};S.extra=S.extra||{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fmt(n){return Math.round(n).toLocaleString('vi-VN')}
function mealSum(m){let k=0,p=0;const it=S.items[m]||{};for(const id in it){k+=F[id].kcal*it[id];p+=F[id].pro*it[id]}for(const e of(S.extra[m]||[])){k+=e.kcal}return{k,p}}
function render(){
 const box=document.getElementById('meals');box.innerHTML='';
 let K=0,P=0,n=0;
 for(const m of MEALS){
  const s=mealSum(m.id);K+=s.k;P+=s.p;if(s.k>0)n++;
  const card=document.createElement('section');card.className='meal';
  card.innerHTML=`<h2>${m.name} · ${m.time}<span>${fmt(s.k)} kcal</span></h2>`;
  const g=document.createElement('div');g.className='grid';
  for(const f of FOODS){
   const c=(S.items[m.id]||{})[f.id]||0;
   const b=document.createElement('button');b.className='food'+(c?' on':'');
   b.innerHTML=`<b>${f.name}</b><i>${f.unit} · ${f.kcal} kcal</i>`+(c?`<span class="cnt">×${c}</span>`:'');
   b.onclick=()=>{(S.items[m.id]=S.items[m.id]||{})[f.id]=c+1;save();render()};
   if(c){const mi=document.createElement('button');mi.className='minus';mi.textContent='−';mi.setAttribute('aria-label','Bớt '+f.name);
    mi.onclick=e=>{e.stopPropagation();if(c<=1)delete S.items[m.id][f.id];else S.items[m.id][f.id]=c-1;save();render()};b.appendChild(mi)}
   g.appendChild(b);
  }
  card.appendChild(g);
  const ex=document.createElement('div');ex.className='extra';
  (S.extra[m.id]||[]).forEach((e,i)=>{const r=document.createElement('div');r.innerHTML=`<span>${e.name.replace(/</g,'&lt;')}: ${fmt(e.kcal)} kcal</span>`;const x=document.createElement('button');x.textContent='Xóa';x.onclick=()=>{S.extra[m.id].splice(i,1);save();render()};r.appendChild(x);ex.appendChild(r)});
  card.appendChild(ex);
  const cu=document.createElement('div');cu.className='custom';
  cu.innerHTML=`<input placeholder="Món khác (vd: phở)"><input type="number" inputmode="numeric" placeholder="kcal"><button>Thêm</button>`;
  const [ni,ki,ab]=cu.children;
  ab.onclick=()=>{const k=parseFloat(ki.value);if(!(k>0)){ki.focus();return}(S.extra[m.id]=S.extra[m.id]||[]).push({name:ni.value.trim()||'Món khác',kcal:k});save();render()};
  card.appendChild(cu);
  box.appendChild(card);
 }
 document.getElementById('kcal').textContent=fmt(K);
 document.getElementById('pro').textContent=fmt(P);
 document.getElementById('nmeal').textContent=n;
 document.getElementById('bar').style.width=Math.min(100,K/TARGET_MIN*100)+'%';
 const st=document.getElementById('status');
 if(K>=TARGET_MIN){st.className='status ok';st.textContent=K>TARGET_MAX?'Đạt! Hôm nay ăn vượt mục tiêu, vẫn tốt cho tăng cân.':'Đạt mục tiêu calo hôm nay!'}
 else{const miss=TARGET_MIN-K;st.className='status low';st.textContent=`Còn thiếu ${fmt(miss)} kcal ≈ ${Math.ceil(miss/100)} quả chuối, hoặc ${Math.ceil(miss/135)} hộp sữa, hoặc ${Math.ceil(miss/200)} chén cơm.`}
 document.getElementById('date').textContent='Hôm nay: '+new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
}
document.getElementById('reset').onclick=()=>{if(confirm('Xóa hết những gì đã ghi hôm nay?')){S=blank();save();render()}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.date!==today()){S=blank();save();render()}});
load();render();
</script>
</body>
</html>
